name: boxim-perf

# 盒子IM 性能测试环境
#   MySQL 8.0 -> localhost:3306   (root / root)
#   Redis 6.2 -> localhost:6380   (无密码，注意不是 6379)
#
# 用法见同目录 README.md

services:
  mysql:
    image: mysql:8.0
    container_name: boxim-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: im_platform_test
      TZ: Asia/Shanghai
    # 参数走命令行而不是挂载 .cnf 配置文件：
    # Windows 上绑定挂载的文件在容器里权限是 0777，MySQL 会以
    #   "World-writable config file ... is ignored"
    # 为由直接跳过，所以只有命令行参数才可靠生效。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=3000
      # 测试数据总量只有 ~100MB，2G 纯属浪费；
      # 这台机器内存极度紧张，调到 512M 能省下约 1.5G 的 Docker VM 内存。
      # 数据全部常驻内存，不会让磁盘成为瓶颈干扰测量。
      - --innodb-buffer-pool-size=512M
      # 压测取向：不每条事务都刷盘，避免磁盘 I/O 掩盖 Redis 瓶颈。【生产勿抄】
      - --innodb-flush-log-at-trx-commit=2
      # 压测取向：关掉 binlog。【生产勿抄】
      - --skip-log-bin
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动时自动执行 im-platform.sql 建表（只执行一次）
      - ../box-im/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 90s

  redis:
    image: redis:6.2
    container_name: boxim-redis
    restart: unless-stopped
    ports:
      # 宿主机 6379 已被本机另一套 Redis 占用，所以映射到 6380
      - "6380:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 40

  # ---------------------------------------------------------------
  # Kafka (KRaft 模式，无 ZooKeeper)
  #
  # 为什么用 KRaft 而不是 ZooKeeper:
  #   少一个容器、少一份 JVM 内存。这台机器内存紧张(可用仅 1.7G)，
  #   KRaft 的单节点至少省下 300-500MB。
  #
  # 为什么用 apache/kafka 官方镜像:
  #   项目约束是「只能用允许商业的免费版本」，apache/kafka 是 Apache-2.0，
  #   无 Confluent Community License 之类的附加限制。
  #
  # 用途: 群聊写扩散(fan-out)任务的持久化队列。
  #   把 O(N) 的扇出从请求线程移到独立消费者，进程重启不丢任务。
  #
  # 单节点 + 单副本，仅用于性能测试。【生产必须 3 节点 + replication-factor>=3】
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: boxim-kafka
    restart: unless-stopped
    ports:
      # 宿主机 9092，供本机 im-platform 连接
      - "9092:9092"
    environment:
      # --- KRaft 角色 ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # 监听 0.0.0.0，但对外通告 127.0.0.1（宿主机应用直连，不经容器网络）
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- 单节点必须降副本，否则 topic 创建会一直等 ISR ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 扇出 topic 默认分区数：与消费者并发度匹配
      KAFKA_NUM_PARTITIONS: 6
      # --- 压测取向：短保留，别把磁盘写满 ---
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      # --- 内存：这台机器可用内存只有 ~1.7G，压到 512M 堆 ---
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  mysql-data:
  kafka-data:
