# ============================================================
#  盒子IM 压测专用 Redis
#  关掉一切持久化，确保测到的是纯内存性能
# ============================================================

port 6379
bind 0.0.0.0
protected-mode no

# ---- 关键：压测时不做任何磁盘落盘 ----
appendonly no
save ""

# ---- 不设内存上限，避免淘汰逻辑干扰 ----
maxmemory 0

# ---- 连接相关：IM 场景会有大量短连接/多客户端 ----
tcp-backlog 4096
tcp-keepalive 300
timeout 0

databases 16
